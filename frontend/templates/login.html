<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Clínica Los Olivos</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="login-page">


    <div class="login-container">


        <!-- ==============================
             LOGO
        =============================== -->


        <div class="logo-container">

    <img
        src="{{ url_for('static', filename='img/losolivos3.png') }}"
        alt="Logo Clínica Los Olivos"
        class="logo"
    >

</div>

       


        <!-- ==============================
             TÍTULO
        =============================== -->

        <h1>
            Clínica Los Olivos
        </h1>

        <p class="subtitle">
            Sistema de gestión clínica
        </p>


        <!-- ==============================
             FORMULARIO
        =============================== -->

        <form id="loginForm">


            <div class="form-group">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingresa tu usuario"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-primary"
            >
                Iniciar sesión
            </button>


        </form>


        <!-- ==============================
             MENSAJE
        =============================== -->

        <p id="mensaje"></p>


        <p class="login-footer">
            Clínica Los Olivos © 2026
        </p>


    </div>


    <!-- JavaScript -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>


</body>

</html>
