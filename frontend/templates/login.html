<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clínica Los Olivos</title>

</head>

<body>

    <h1>Clínica Los Olivos</h1>

    <h2>Iniciar sesión</h2>

    <form id="loginForm">

        <label for="usuario">
            Usuario:
        </label>

        <input
            type="text"
            id="usuario"
            name="usuario"
            required
        >

        <br><br>

        <label for="password">
            Contraseña:
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

    <p id="mensaje"></p>


    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
